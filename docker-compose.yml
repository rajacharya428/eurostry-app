services:
  postgres:
    image: postgres:16-alpine
    container_name: eurostry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eurostry
      POSTGRES_USER: eurostry
      POSTGRES_PASSWORD: eurostry_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
